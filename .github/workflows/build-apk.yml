name: Android APK derle

on:
  workflow_dispatch:   # Actions sekmesinden elle başlatılır

permissions:
  contents: write      # APK'yı "Releases" bölümüne koymak için

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://saapp-byte.github.io/Hirt
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Konum paketini kur (SDK'ya uygun sürüm)
        run: npx expo install expo-location

      - name: Uygulama adı ve paket adı
        run: python3 prepare_build.py

      - name: Android projesini üret
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: APK'yı bul
        id: apk
        run: |
          f=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$f" hirt.apk
          echo "path=apps/mobile/hirt.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hirt-apk
          path: apps/mobile/hirt.apk

      - name: Releases bölümüne koy (telefonda tek dokunuşla indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          gh release delete apk-son -y --cleanup-tag 2>/dev/null || true
          gh release create apk-son "${{ steps.apk.outputs.path }}" --title "Hirt APK (son sürüm)" --notes "Telefonda indirip kur. Güncelleme için bu sayfa yenilenir." --prerelease
