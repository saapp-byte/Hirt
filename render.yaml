services:
  - type: web
    name: hirt-api
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    disk:
      name: hirt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HIRT_DATA_DIR
        value: /var/data
      - key: HIRT_NO_SAMPLE
        value: "1"
      - key: INGEST_EVERY_HOURS
        value: "3"
